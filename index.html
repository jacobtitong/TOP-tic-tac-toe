<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- CSS FILES -->
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="styles.css" />
    <!-- JS FILES -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="game-container" style="display: none">
      <h1 class="game-status"></h1>
      <div class="board"></div>
      <div class="buttons">
        <button class="restart-button" style="display: none">Play Again</button>
        <button class="back-button" style="display: none">
          Back to Start Menu
        </button>
      </div>
    </div>
    <div class="start-menu">
      <div class="start">
        <h1>Tic-Tac-Toe Project</h1>
        <button class="play-button">Play Game</button>
      </div>
      <form action="" style="display: none">
        <p>Enter player names:</p>
        <label for="player-one">
          <input
            type="text"
            name="player-one"
            id="player-one"
            required
            placeholder="Player One"
          />
        </label>
        <label for="player-two">
          <input
            type="text"
            name="player-two"
            id="player-two"
            required
            placeholder="Player Two"
          />
        </label>
        <button type="submit">Start</button>
      </form>
    </div>
  </body>
</html>
